<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre - Base de Dades SCP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .register-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        
        .register-container h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .register-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .register-btn:active {
            transform: translateY(0);
        }
        
        .error-message {
            background-color: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        
        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        .password-hint {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h1>Crear Compte</h1>
        
        <div id="errorMessage" class="error-message"></div>
        
        <form id="registerForm" method="POST" action="/auth/register">
            <div class="form-group">
                <label for="username">Nom d'usuari</label>
                <input type="text" id="username" name="username" required placeholder="Escull un nom d'usuari" minlength="3">
            </div>
            
            <div class="form-group">
                <label for="password">Contrasenya</label>
                <input type="password" id="password" name="password" required placeholder="Introdueix la teva contrasenya" minlength="6">
                <div class="password-hint">Mínim 6 caràcters</div>
            </div>
            
            <div class="form-group">
                <label for="passwordConfirm">Confirma la Contrasenya</label>
                <input type="password" id="passwordConfirm" name="password_confirm" required placeholder="Confirma la teva contrasenya" minlength="6">
            </div>
            
            <button type="submit" class="register-btn">Registre</button>
        </form>
        
        <div class="login-link">
            Ja tens compte? <a href="/login">Inicia sessió aquí</a>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('registerForm');
        const errorMessage = document.getElementById('errorMessage');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            
            if (password !== passwordConfirm) {
                errorMessage.textContent = 'Les contrasenyes no coincideixen.';
                errorMessage.classList.add('show');
                return;
            }
            
            const username = document.getElementById('username').value;
            
            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);
                formData.append('password_confirm', passwordConfirm);
                
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    // Redirect to login on success
                    window.location.href = '/login';
                } else {
                    const data = await response.json();
                    errorMessage.textContent = data.detail || 'Ha fallat el registre. Si us plau, torna a intentar.';
                    errorMessage.classList.add('show');
                }
            } catch (error) {
                errorMessage.textContent = 'Ha ocorregut un error. Si us plau, torna a intentar.';
                errorMessage.classList.add('show');
            }
        });
    </script>
</body>
</html>
